<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#080D1A"/>
<title>VoltFlow — EV Fleet Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;background:#080D1A}
body{font-family:'DM Sans','Segoe UI',sans-serif;overscroll-behavior:none}
::-webkit-scrollbar{display:none}
input,select,textarea{outline:none;font-family:inherit;-webkit-appearance:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
.press{transition:transform .12s}.press:active{transform:scale(.96)}
.fin{animation:fin .22s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect}=React;
const db={
  get:(k)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}},
};
const ADMIN={username:"dalitso",password:"voltflow2026",role:"admin",name:"Dalitso"};
const SEED=[
  {id:1,name:"Chanda Mwale",  bike:"VF-001",status:"active",     license:"CLASS-A-2341",guarantor:"M. Mwale – Chelstone",phone:"+260 97 123 4567",joinDate:"2026-01-15"},
  {id:2,name:"Bwalya Phiri",  bike:"VF-002",status:"active",     license:"CLASS-A-5892",guarantor:"J. Phiri – Kabulonga", phone:"+260 96 234 5678",joinDate:"2026-01-15"},
  {id:3,name:"Mutale Banda",  bike:"VF-003",status:"maintenance",license:"CLASS-A-7123",guarantor:"P. Banda – Woodlands", phone:"+260 95 345 6789",joinDate:"2026-01-15"},
  {id:4,name:"Kapembwa Zulu", bike:"VF-004",status:"active",     license:"CLASS-A-4456",guarantor:"R. Zulu – Roma",       phone:"+260 97 456 7890",joinDate:"2026-01-15"},
];
const C={bg:"#080D1A",surface:"#0F1729",card:"#141F35",border:"#1C2D48",accent:"#00E5A0",accentD:"#00E5A018",gold:"#F5B731",goldD:"#F5B73118",red:"#FF4D6A",redD:"#FF4D6A18",blue:"#4A9EFF",blueD:"#4A9EFF18",purple:"#A855F7",purpleD:"#A855F718",text:"#E2EDFF",muted:"#5A6E8A"};
const sc=(s)=>s==="active"?C.accent:s==="maintenance"?C.gold:C.red;
const NOW=new Date(),TM=NOW.getMonth(),TY=NOW.getFullYear();
const todayKey=NOW.toISOString().split("T")[0];
const monthKey=`${TY}-${String(TM+1).padStart(2,"0")}`;
const wkNum=(d)=>{const f=new Date(d.getFullYear(),d.getMonth(),1);return Math.ceil((d.getDate()+f.getDay())/7);};
const isBonusWeek=wkNum(NOW)===4;
const fmt=(n)=>Number(n).toLocaleString();
const INP={width:"100%",background:C.surface,border:`1px solid ${C.border}`,borderRadius:10,padding:"13px 14px",color:C.text,fontSize:15,fontFamily:"inherit"};

function App(){
  const[user,setUser]=useState(null);
  const[riders,setRiders]=useState(()=>db.get("vf-riders")||SEED);
  const[cols,setCols]=useState(()=>db.get("vf-cols")||{});
  const[fnotes,setFnotes]=useState(()=>db.get("vf-notes")||{});
  const[users,setUsers]=useState(()=>db.get("vf-users")||[ADMIN]);
  const[ready,setReady]=useState(false);
  useEffect(()=>{
    const s=db.get("vf-session");
    if(s){const all=db.get("vf-users")||[ADMIN];const f=all.find(u=>u.username===s.username&&u.password===s.password);if(f)setUser(f);}
    setReady(true);
  },[]);
  useEffect(()=>{db.set("vf-riders",riders);},[riders]);
  useEffect(()=>{db.set("vf-cols",cols);},[cols]);
  useEffect(()=>{db.set("vf-notes",fnotes);},[fnotes]);
  useEffect(()=>{db.set("vf-users",users);},[users]);
  useEffect(()=>{if(ready)db.set("vf-session",user);},[user,ready]);
  const addCol=(rid,d,amt)=>setCols(c=>({...c,[`${rid}-${d}`]:parseFloat(amt)}));
  const updRider=(id,p)=>setRiders(rs=>rs.map(r=>r.id===id?{...r,...p}:r));
  const addRider=(r)=>setRiders(rs=>[...rs,{...r,id:Date.now(),status:"active"}]);
  const delRider=(id)=>setRiders(rs=>rs.filter(r=>r.id!==id));
  const addNote=(bike,note)=>setFnotes(n=>({...n,[bike]:[...(n[bike]||[]),{note,date:todayKey}].slice(-10)}));
  const addUser=(u)=>setUsers(us=>[...us,u]);
  const delUser=(un)=>setUsers(us=>us.filter(u=>u.username!==un));
  if(!ready)return React.createElement("div",{style:{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}},React.createElement(Logo,{size:52}));
  if(!user)return React.createElement(Login,{users,onLogin:setUser});
  return React.createElement(Shell,{user,riders,cols,fnotes,users,onLogout:()=>setUser(null),addCol,updRider,addRider,delRider,addNote,addUser,delUser});
}

function Login({users,onLogin}){
  const[un,setUn]=useState("");const[pw,setPw]=useState("");const[err,setErr]=useState("");const[show,setShow]=useState(false);
  const go=()=>{const f=users.find(u=>u.username===un.trim()&&u.password===pw);f?(setErr(""),onLogin(f)):setErr("Incorrect username or password.");};
  return(
    <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px 20px"}}>
      <div style={{width:"100%",maxWidth:400}}>
        <div style={{textAlign:"center",marginBottom:40}}><Logo size={60}/><div style={{fontSize:13,color:C.muted,marginTop:14}}>EV Courier Fleet Management · Lusaka 2026</div></div>
        <div style={{background:C.card,borderRadius:22,padding:"28px 24px",border:`1px solid ${C.border}`}}>
          <div style={{fontSize:19,fontWeight:700,marginBottom:22}}>Sign In</div>
          <div style={{marginBottom:14}}><Label>Username</Label><input value={un} onChange={e=>setUn(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="username" style={INP}/></div>
          <div><Label>Password</Label><div style={{position:"relative"}}><input value={pw} onChange={e=>setPw(e.target.value)} type={show?"text":"password"} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••" style={{...INP,paddingRight:60}}/><button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",color:C.muted,fontSize:11,fontWeight:700}}>{show?"HIDE":"SHOW"}</button></div></div>
          {err&&<div style={{color:C.red,fontSize:13,marginTop:12,padding:"10px 12px",background:C.redD,borderRadius:8,border:`1px solid ${C.red}33`}}>{err}</div>}
          <button className="press" onClick={go} style={{width:"100%",marginTop:22,background:C.accent,color:"#000",borderRadius:13,padding:"15px",fontWeight:700,fontSize:16}}>Sign In →</button>
          <div style={{marginTop:20,padding:"14px 16px",background:C.surface,borderRadius:12,border:`1px solid ${C.border}`}}>
            <div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:1.5,marginBottom:10}}>YOUR ADMIN CREDENTIALS</div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:6}}><span style={{color:C.muted}}>Username</span><span style={{color:C.accent,fontWeight:700,fontFamily:"monospace"}}>dalitso</span></div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:13}}><span style={{color:C.muted}}>Password</span><span style={{color:C.accent,fontWeight:700,fontFamily:"monospace"}}>voltflow2026</span></div>
          </div>
        </div>
      </div>
    </div>
  );
}

function Shell({user,riders,cols,fnotes,users,onLogout,addCol,updRider,addRider,delRider,addNote,addUser,delUser}){
  const[tab,setTab]=useState("dashboard");const[modal,setModal]=useState(null);
  const mCols=Object.entries(cols).filter(([k])=>k.includes(monthKey)).reduce((a,[k,v])=>{const id=parseInt(k);a[id]=(a[id]||0)+v;return a;},{});
  const tCols=Object.entries(cols).filter(([k])=>k.endsWith(todayKey)).reduce((a,[k,v])=>{const id=parseInt(k);a[id]=v;return a;},{});
  const active=riders.filter(r=>r.status==="active").length;
  const rev=Object.values(mCols).reduce((a,b)=>a+b,0);
  const lease=riders.filter(r=>r.status!=="off-road").length*1800;const swap=active*25*26;const adm=500;const ins=riders.length*200;
  const opex=lease+swap+adm+ins;const net=rev-opex;const proj=active*200*19;const pct=proj>0?Math.min(100,Math.round(rev/proj*100)):0;
  const P={user,riders,cols,mCols,tCols,fnotes,users,active,rev,lease,swap,adm,ins,opex,net,proj,pct,addCol,updRider,addRider,delRider,addNote,addUser,delUser,openModal:setModal};
  const TABS=[{id:"dashboard",l:"Home",d:"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"},{id:"riders",l:"Riders",d:"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"},{id:"fleet",l:"Fleet",d:"M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"},{id:"pnl",l:"P&L",d:"M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"},...(user.role==="admin"?[{id:"admin",l:"Admin",d:"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"}]:[])];
  return(
    <div style={{background:C.bg,minHeight:"100vh",maxWidth:480,margin:"0 auto",color:C.text,paddingBottom:84}}>
      <div style={{background:"linear-gradient(160deg,#0C1830,#080D1A)",borderBottom:`1px solid ${C.border}`,padding:"16px 18px 13px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <Logo size={30}/>
          <div style={{textAlign:"center"}}><div style={{fontSize:11,color:C.muted}}>{NOW.toLocaleDateString("en-ZM",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>{isBonusWeek&&<div style={{fontSize:10,color:C.gold,fontWeight:700,marginTop:2}}>★ BONUS WEEK</div>}</div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{textAlign:"right"}}><div style={{fontSize:13,fontWeight:700}}>{user.name}</div><div style={{fontSize:10,color:user.role==="admin"?C.accent:C.blue,fontWeight:700,textTransform:"uppercase",letterSpacing:.8}}>{user.role}</div></div>
            <button className="press" onClick={onLogout} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:9,padding:"6px 11px",fontSize:11,color:C.muted,fontWeight:600}}>Out</button>
          </div>
        </div>
      </div>
      <div style={{padding:"16px 16px 0"}} className="fin" key={tab}>
        {tab==="dashboard"&&<Dashboard {...P}/>}{tab==="riders"&&<Riders {...P}/>}{tab==="fleet"&&<Fleet {...P}/>}{tab==="pnl"&&<PnL {...P}/>}{tab==="admin"&&user.role==="admin"&&<Admin {...P}/>}
      </div>
      {modal&&<Modal modal={modal} onClose={()=>setModal(null)} riders={riders} onAddCol={(r,d,a)=>{addCol(r,d,a);setModal(null);}} onAddRider={(r)=>{addRider(r);setModal(null);}} onAddUser={(u)=>{addUser(u);setModal(null);}}/>}
      <nav style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:480,background:C.surface,borderTop:`1px solid ${C.border}`,display:"flex",zIndex:100}}>
        {TABS.map(t=><button key={t.id} className="press" onClick={()=>setTab(t.id)} style={{flex:1,padding:"10px 4px 13px",display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:tab===t.id?C.accent:C.muted,borderTop:`2px solid ${tab===t.id?C.accent:"transparent"}`,transition:"all .15s"}}><svg width={20} height={20} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d={t.d}/></svg><span style={{fontSize:10,fontWeight:tab===t.id?700:400}}>{t.l}</span></button>)}
      </nav>
    </div>
  );
}

function Dashboard({riders,tCols,mCols,rev,net,opex,proj,pct,active,openModal}){
  const tt=Object.values(tCols).reduce((a,b)=>a+b,0);
  const pending=riders.filter(r=>r.status==="active"&&!tCols[r.id]);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {isBonusWeek&&<Banner color={C.gold} icon="★"><b style={{color:C.gold}}>Bonus Week Active</b><div style={{fontSize:12,color:C.muted,marginTop:3}}>Riders keep 100% of earnings this week.</div></Banner>}
      <Card label="Today's Cabo Collections">
        <div style={{fontSize:42,fontWeight:700,color:C.accent,letterSpacing:-2,lineHeight:1}}>K{fmt(tt)}</div>
        <div style={{fontSize:12,color:C.muted,margin:"6px 0 16px"}}>{Object.keys(tCols).length} of {active} active riders collected</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}}>
          {riders.filter(r=>r.status==="active").map(r=>(
            <div key={r.id} style={{display:"flex",alignItems:"center",gap:6,background:tCols[r.id]?C.accentD:C.redD,border:`1px solid ${(tCols[r.id]?C.accent:C.red)}33`,borderRadius:20,padding:"5px 12px"}}>
              <div style={{width:6,height:6,borderRadius:"50%",background:tCols[r.id]?C.accent:C.red}}/>
              <span style={{fontSize:12,color:tCols[r.id]?C.accent:C.red,fontWeight:600}}>{r.name.split(" ")[0]}{tCols[r.id]?` · K${fmt(tCols[r.id])}`:" · Pending"}</span>
            </div>
          ))}
        </div>
        <Btn onClick={()=>openModal({type:"collect"})}>+ Record Cabo Payment</Btn>
      </Card>
      <Card label="Month Revenue vs Target">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:14}}>
          <div><div style={{fontSize:32,fontWeight:700,letterSpacing:-1}}>K{fmt(rev)}</div><div style={{fontSize:12,color:C.muted,marginTop:4}}>of K{fmt(proj)} projected</div></div>
          <div style={{fontSize:36,fontWeight:700,color:pct>=80?C.accent:pct>=50?C.gold:C.red,letterSpacing:-1}}>{pct}%</div>
        </div>
        <PBar pct={pct}/>
      </Card>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Mini label="Net Profit" val={`K${fmt(Math.abs(net))}`} sub={net>=0?"this month":"deficit"} color={net>=0?C.accent:C.red}/>
        <Mini label="Total OPEX" val={`K${fmt(opex)}`} sub="this month" color={C.muted}/>
      </div>
      {pending.length>0&&<Banner color={C.red} icon="⚠"><b style={{color:C.red,fontSize:13}}>Pending Cabo Today</b>{pending.map(r=><div key={r.id} style={{fontSize:12,color:C.muted,marginTop:4}}>{r.name} — {r.bike}</div>)}</Banner>}
      <Card label="Fleet Overview">
        <div style={{display:"flex",gap:10}}>
          {[["Active",C.accent,"active"],["Service",C.gold,"maintenance"],["Off-Road",C.red,"off-road"]].map(([l,c,s])=>(
            <div key={s} style={{flex:1,background:C.surface,borderRadius:12,padding:"14px 8px",textAlign:"center",border:`1px solid ${C.border}`}}>
              <div style={{fontSize:28,fontWeight:700,color:c}}>{riders.filter(r=>r.status===s).length}</div>
              <div style={{fontSize:11,color:C.muted,marginTop:4}}>{l}</div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

function Riders({user,riders,cols,mCols,tCols,updRider,delRider,openModal}){
  const[sel,setSel]=useState(null);
  if(sel!==null){
    const r=riders.find(x=>x.id===sel);if(!r){setSel(null);return null;}
    const mt=mCols[r.id]||0;const tgt=200*19;const pct=Math.min(100,Math.round(mt/tgt*100))||0;
    const weeks=[1,2,3,4].map(w=>{
      const en=Object.entries(cols).filter(([k])=>{
        const parts=k.split("-");const rid=parseInt(parts[0]);if(rid!==r.id)return false;
        const dateStr=parts.slice(1).join("-");const d=new Date(dateStr);
        return d.getMonth()===TM&&d.getFullYear()===TY&&wkNum(d)===w;
      });
      return{w,days:en.length,total:en.reduce((a,[,v])=>a+v,0)};
    });
    const allTime=Object.entries(cols).filter(([k])=>parseInt(k.split("-")[0])===r.id).reduce((a,[,v])=>a+v,0);
    return(
      <div style={{display:"flex",flexDirection:"column",gap:14}} className="fin">
        <BackBtn onClick={()=>setSel(null)}/>
        <div style={{background:C.card,borderRadius:18,padding:20,border:`1px solid ${C.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}><div><div style={{fontSize:22,fontWeight:700}}>{r.name}</div><div style={{fontSize:14,color:C.accent,marginTop:5,fontWeight:600}}>⚡ {r.bike}</div></div><SBadge status={r.status}/></div>
          <IR l="Licence" v={r.license}/><IR l="Phone" v={r.phone}/><IR l="Guarantor" v={r.guarantor}/><IR l="Joined" v={r.joinDate}/><IR l="All-Time Collected" v={<span style={{color:C.accent,fontWeight:700}}>K{fmt(allTime)}</span>}/>
        </div>
        <Card label="This Month">
          <div style={{fontSize:32,fontWeight:700,letterSpacing:-1}}>K{fmt(mt)}</div>
          <div style={{fontSize:12,color:C.muted,marginBottom:14}}>target K{fmt(tgt)}</div>
          <PBar pct={pct}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginTop:16}}>
            {weeks.map(({w,days,total})=>(
              <div key={w} style={{background:C.surface,borderRadius:12,padding:"12px 6px",textAlign:"center",border:`1px solid ${w===4?C.gold+"44":C.border}`}}>
                <div style={{fontSize:10,color:w===4?C.gold:C.muted,marginBottom:5,fontWeight:700}}>{w===4?"★ WK4":`WK${w}`}</div>
                <div style={{fontSize:14,fontWeight:700,color:w===4?C.gold:C.text}}>K{fmt(total)}</div>
                <div style={{fontSize:10,color:C.muted,marginTop:2}}>{days}d</div>
              </div>
            ))}
          </div>
        </Card>
        {user.role==="admin"&&<Card label="Update Status"><div style={{display:"flex",gap:8}}>{[["active","✓ Active"],["maintenance","🔧 Service"],["off-road","⛔ Off-Road"]].map(([s,l])=><button key={s} className="press" onClick={()=>updRider(r.id,{status:s})} style={{flex:1,padding:"11px 4px",borderRadius:11,fontSize:11,fontWeight:700,border:`1px solid ${r.status===s?sc(s)+"88":C.border}`,background:r.status===s?sc(s)+"22":"transparent",color:r.status===s?sc(s):C.muted}}>{l}</button>)}</div></Card>}
        <Btn onClick={()=>openModal({type:"collect",riderId:r.id})}>+ Record Cabo Payment</Btn>
        {user.role==="admin"&&<button className="press" onClick={()=>{if(window.confirm(`Remove ${r.name}?`)){delRider(r.id);setSel(null);}}} style={{width:"100%",padding:"13px",borderRadius:13,fontSize:14,fontWeight:600,border:`1px solid ${C.red}44`,color:C.red,background:C.redD}}>Remove Rider from Fleet</button>}
      </div>
    );
  }
  return(
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <div style={{fontSize:17,fontWeight:700}}>Riders ({riders.length})</div>
        {user.role==="admin"&&<GBtn color={C.accent} onClick={()=>openModal({type:"addRider"})}>+ Add Rider</GBtn>}
      </div>
      {riders.map(r=>{
        const ma=mCols[r.id]||0,ta=tCols[r.id];
        const days=Object.keys(cols).filter(k=>parseInt(k.split("-")[0])===r.id&&k.includes(monthKey)).length;
        return(
          <button key={r.id} className="press" onClick={()=>setSel(r.id)} style={{background:C.card,borderRadius:16,padding:18,border:`1px solid ${C.border}`,textAlign:"left",width:"100%"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}><div><div style={{fontWeight:700,fontSize:16}}>{r.name}</div><div style={{fontSize:13,color:C.accent,marginTop:4,fontWeight:600}}>⚡ {r.bike}</div></div><SBadge status={r.status}/></div>
            <div style={{display:"flex",gap:20}}>
              <Stat l="Today" v={isBonusWeek?"★ Bonus":ta?`K${fmt(ta)}`:"Pending"} c={ta?C.accent:isBonusWeek?C.gold:C.muted}/>
              <Stat l="Month" v={`K${fmt(ma)}`}/>
              <Stat l="Days" v={days} c={C.blue}/>
            </div>
          </button>
        );
      })}
    </div>
  );
}

function Fleet({user,riders,fnotes,updRider,addNote,openModal}){
  const[ni,setNi]=useState({});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <div style={{fontSize:17,fontWeight:700}}>Fleet ({riders.length} Bikes)</div>
        {user.role==="admin"&&<GBtn color={C.accent} onClick={()=>openModal({type:"addRider"})}>+ Add Bike</GBtn>}
      </div>
      {riders.map(r=>{
        const rn=fnotes[r.bike]||[];
        return(
          <div key={r.id} style={{background:C.card,borderRadius:16,padding:18,border:`1px solid ${sc(r.status)}33`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}><div><div style={{fontWeight:700,fontSize:17,color:C.accent}}>⚡ {r.bike}</div><div style={{fontSize:13,color:C.muted,marginTop:4}}>{r.name}</div></div><SBadge status={r.status}/></div>
            {user.role==="admin"&&<div style={{display:"flex",gap:8,marginBottom:14}}>{[["active","✓ Active"],["maintenance","🔧 Service"],["off-road","⛔ Off-Road"]].map(([s,l])=><button key={s} className="press" onClick={()=>updRider(r.id,{status:s})} style={{flex:1,padding:"9px 4px",borderRadius:10,fontSize:11,fontWeight:700,border:`1px solid ${r.status===s?sc(s)+"88":C.border}`,background:r.status===s?sc(s)+"22":"transparent",color:r.status===s?sc(s):C.muted}}>{l}</button>)}</div>}
            {rn.length>0&&<div style={{marginBottom:14,borderTop:`1px solid ${C.border}`,paddingTop:12}}><div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:1.2,marginBottom:8}}>RECENT NOTES</div>{rn.slice(-3).map((n,i)=><div key={i} style={{fontSize:12,padding:"5px 0",borderBottom:i<Math.min(rn.length,3)-1?`1px solid ${C.border}`:"none"}}><span style={{color:C.muted,marginRight:8,fontSize:11}}>{n.date}</span>{n.note}</div>)}</div>}
            <div style={{display:"flex",gap:8}}><input value={ni[r.bike]||""} placeholder="Add maintenance note…" onChange={e=>setNi(n=>({...n,[r.bike]:e.target.value}))} style={{...INP,padding:"10px 12px",flex:1,fontSize:13}}/><button className="press" onClick={()=>{if(ni[r.bike]?.trim()){addNote(r.bike,ni[r.bike].trim());setNi(n=>({...n,[r.bike]:""}));}}} style={{background:C.accent,color:"#000",borderRadius:10,padding:"10px 16px",fontWeight:700,fontSize:13,whiteSpace:"nowrap"}}>Save</button></div>
          </div>
        );
      })}
    </div>
  );
}

function PnL({riders,mCols,rev,opex,net,proj,lease,swap,adm,ins,active}){
  const margin=rev>0?Math.round(net/rev*100):0;const bc=riders.filter(r=>r.status!=="off-road").length;
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:net>=0?"#003D2060":"#3D000060",border:`1px solid ${net>=0?C.accent:C.red}55`,borderRadius:20,padding:"28px 20px",textAlign:"center"}}>
        <div style={{fontSize:10,color:C.muted,letterSpacing:2.5,textTransform:"uppercase",marginBottom:10}}>Net Profit — {NOW.toLocaleDateString("en-ZM",{month:"long",year:"numeric"})}</div>
        <div style={{fontSize:52,fontWeight:700,color:net>=0?C.accent:C.red,letterSpacing:-2,lineHeight:1}}>K{fmt(Math.abs(net))}</div>
        <div style={{fontSize:14,color:C.muted,marginTop:10}}>{margin>=0?"+":""}{margin}% margin</div>
      </div>
      <Card label="Revenue"><PLR l="Rider Cabo Collections" v={rev} pos/><div style={{borderTop:`1px solid ${C.border}`,paddingTop:10,marginTop:8}}><PLR l="Total Revenue" v={rev} pos bold/></div></Card>
      <Card label="Operating Costs">
        <PLR l={`Lease · ${bc} bikes × K1,800`} v={lease}/>
        <PLR l={`Battery Swaps · ${active} × K650`} v={swap}/>
        <PLR l="Admin & Marketing" v={adm}/>
        <PLR l={`Insurance · ${riders.length} × K200`} v={ins}/>
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10,marginTop:8}}><PLR l="Total OPEX" v={opex} bold/></div>
      </Card>
      <Card label="By Rider">{riders.map(r=><PLR key={r.id} l={`${r.name} (${r.bike})`} v={mCols[r.id]||0} pos color={C.blue}/>)}</Card>
      <div style={{background:C.blueD,border:`1px solid ${C.blue}44`,borderRadius:14,padding:16}}>
        <div style={{fontWeight:700,color:C.blue,fontSize:13,marginBottom:8}}>📊 Month Projection</div>
        <div style={{fontSize:13,color:C.muted,lineHeight:1.9}}>Target revenue: <b style={{color:C.text}}>K{fmt(proj)}</b><br/>Target net profit: <b style={{color:C.accent}}>K{fmt(proj-opex)}</b></div>
      </div>
    </div>
  );
}

function Admin({riders,cols,users,delUser,openModal}){
  const[sec,setSec]=useState("overview");
  const allTime=Object.values(cols).reduce((a,b)=>a+b,0);const txns=Object.keys(cols).length;
  const top=riders.reduce((b,r)=>{const t=Object.entries(cols).filter(([k])=>parseInt(k.split("-")[0])===r.id).reduce((a,[,v])=>a+v,0);return t>(b.t||0)?{...r,t}:b;},{});
  return(
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:"linear-gradient(135deg,#1E0A3C,#0D1A35)",border:`1px solid ${C.purple}44`,borderRadius:18,padding:"18px 20px",display:"flex",alignItems:"center",gap:16}}>
        <div style={{fontSize:36}}>🛡️</div>
        <div><div style={{fontWeight:700,fontSize:17,color:C.purple}}>Admin Panel</div><div style={{fontSize:12,color:C.muted,marginTop:3}}>Full system control · Dalitso</div></div>
      </div>
      <div style={{display:"flex",gap:6,background:C.surface,borderRadius:13,padding:5}}>
        {[["overview","📊 Overview"],["users","👤 Users"],["data","📋 Data"]].map(([id,l])=><button key={id} className="press" onClick={()=>setSec(id)} style={{flex:1,padding:"10px 4px",borderRadius:10,fontSize:12,fontWeight:700,background:sec===id?C.card:"transparent",color:sec===id?C.text:C.muted,border:`1px solid ${sec===id?C.border:"transparent"}`}}>{l}</button>)}
      </div>
      {sec==="overview"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Mini label="All-Time Collected" val={`K${fmt(allTime)}`} sub={`${txns} transactions`} color={C.accent}/>
            <Mini label="Top Rider" val={top.name?.split(" ")[0]||"—"} sub={`K${fmt(top.t||0)} total`} color={C.gold}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <Mini label="Total Riders" val={riders.length} sub="registered" color={C.blue}/>
            <Mini label="System Users" val={users.length} sub="accounts" color={C.purple}/>
          </div>
          <Card label="Rider All-Time Totals">
            {riders.map(r=>{
              const total=Object.entries(cols).filter(([k])=>parseInt(k.split("-")[0])===r.id).reduce((a,[,v])=>a+v,0);
              const days=Object.keys(cols).filter(k=>parseInt(k.split("-")[0])===r.id).length;
              return<div key={r.id} style={{display:"flex",justifyContent:"space-between",padding:"11px 0",borderBottom:`1px solid ${C.border}`,alignItems:"center"}}><div><div style={{fontSize:14,fontWeight:600}}>{r.name}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{r.bike} · {days} days</div></div><div style={{fontSize:16,fontWeight:700,color:C.accent}}>K{fmt(total)}</div></div>;
            })}
          </Card>
        </div>
      )}
      {sec==="users"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{fontSize:15,fontWeight:700}}>Users ({users.length})</div><GBtn color={C.purple} onClick={()=>openModal({type:"addUser"})}>+ Add User</GBtn></div>
          {users.map(u=>(
            <div key={u.username} style={{background:C.card,borderRadius:16,padding:18,border:`1px solid ${u.role==="admin"?C.purple+"44":C.border}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><div style={{fontWeight:700,fontSize:15}}>{u.name}</div><div style={{fontSize:12,color:C.muted,marginTop:4,fontFamily:"monospace"}}>@{u.username}</div></div>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <Chip label={u.role} color={u.role==="admin"?C.purple:u.role==="rider"?C.blue:C.muted}/>
                  {u.username!=="dalitso"&&<button className="press" onClick={()=>{if(window.confirm(`Remove ${u.name}?`))delUser(u.username);}} style={{color:C.red,fontSize:11,fontWeight:700,background:C.redD,border:`1px solid ${C.red}44`,borderRadius:8,padding:"6px 11px"}}>Remove</button>}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
      {sec==="data"&&(
        <Card label="All Transactions">
          <div style={{maxHeight:400,overflowY:"auto"}}>
            {Object.keys(cols).length===0?<div style={{color:C.muted,fontSize:13,textAlign:"center",padding:"24px 0"}}>No transactions yet.</div>
            :Object.entries(cols).sort(([a],[b])=>b.localeCompare(a)).map(([k,v])=>{
              const parts=k.split("-");const rid=parseInt(parts[0]);const rider=riders.find(r=>r.id===rid);const date=parts.slice(1).join("-");
              return<div key={k} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}><div><div style={{fontWeight:600}}>{rider?.name||`Rider ${rid}`}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{rider?.bike} · {date}</div></div><span style={{color:C.accent,fontWeight:700,fontSize:14}}>K{fmt(v)}</span></div>;
            })}
          </div>
        </Card>
      )}
    </div>
  );
}

function Modal({modal,onClose,riders,onAddCol,onAddRider,onAddUser}){
  const[rid,setRid]=useState(modal.riderId||riders.find(r=>r.status==="active")?.id||"");
  const[amt,setAmt]=useState("");const[dt,setDt]=useState(todayKey);
  const[name,setName]=useState("");const[bike,setBike]=useState(`VF-00${riders.length+1}`);
  const[lic,setLic]=useState("");const[guar,setGuar]=useState("");const[ph,setPh]=useState("");const[jd,setJd]=useState(todayKey);
  const[un,setUn]=useState("");const[uw,setUw]=useState("");const[up,setUp]=useState("");const[ur,setUr]=useState("viewer");const[sp,setSp]=useState(false);
  const T={collect:"Record Cabo Payment",addRider:"Add New Rider",addUser:"Add System User"};
  return(
    <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-end",background:"rgba(0,0,0,0.85)"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{width:"100%",maxWidth:480,background:C.card,borderRadius:"24px 24px 0 0",padding:"24px 20px 50px",border:`1px solid ${C.border}`,maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
          <div style={{fontWeight:700,fontSize:18}}>{T[modal.type]}</div>
          <button className="press" onClick={onClose} style={{color:C.muted,background:C.surface,borderRadius:"50%",width:34,height:34,fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",border:`1px solid ${C.border}`}}>×</button>
        </div>
        {modal.type==="collect"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Fld label="Rider"><select value={rid} onChange={e=>setRid(parseInt(e.target.value))} style={INP}>{riders.filter(r=>r.status==="active").map(r=><option key={r.id} value={r.id}>{r.name} — {r.bike}</option>)}</select></Fld>
          <Fld label="Amount (K)"><input type="number" value={amt} placeholder="e.g. 200" onChange={e=>setAmt(e.target.value)} style={INP} inputMode="numeric"/></Fld>
          <Fld label="Date"><input type="date" value={dt} onChange={e=>setDt(e.target.value)} style={INP}/></Fld>
          <Btn onClick={()=>{if(rid&&amt)onAddCol(parseInt(rid),dt,parseFloat(amt));}}>✓ Save Payment</Btn>
        </div>}
        {modal.type==="addRider"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Fld label="Full Name"><input value={name} placeholder="e.g. Chanda Mwale" onChange={e=>setName(e.target.value)} style={INP}/></Fld>
          <Fld label="Bike ID"><input value={bike} placeholder="VF-005" onChange={e=>setBike(e.target.value)} style={INP}/></Fld>
          <Fld label="Phone"><input value={ph} placeholder="+260 97 XXX XXXX" onChange={e=>setPh(e.target.value)} style={INP} inputMode="tel"/></Fld>
          <Fld label="Licence Number"><input value={lic} placeholder="CLASS-A-XXXX" onChange={e=>setLic(e.target.value)} style={INP}/></Fld>
          <Fld label="Guarantor"><input value={guar} placeholder="J. Phiri – Kabulonga" onChange={e=>setGuar(e.target.value)} style={INP}/></Fld>
          <Fld label="Join Date"><input type="date" value={jd} onChange={e=>setJd(e.target.value)} style={INP}/></Fld>
          <Btn onClick={()=>{if(name&&bike&&lic&&guar)onAddRider({name,bike,license:lic,guarantor:guar,phone:ph,joinDate:jd});}}>✓ Add Rider</Btn>
        </div>}
        {modal.type==="addUser"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
          <Fld label="Full Name"><input value={un} placeholder="Full name" onChange={e=>setUn(e.target.value)} style={INP}/></Fld>
          <Fld label="Username"><input value={uw} placeholder="e.g. bwalya" onChange={e=>setUw(e.target.value)} style={INP}/></Fld>
          <Fld label="Password"><div style={{position:"relative"}}><input value={up} type={sp?"text":"password"} placeholder="Set a password" onChange={e=>setUp(e.target.value)} style={{...INP,paddingRight:60}}/><button onClick={()=>setSp(s=>!s)} style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",color:C.muted,fontSize:11,fontWeight:700}}>{sp?"HIDE":"SHOW"}</button></div></Fld>
          <Fld label="Role"><select value={ur} onChange={e=>setUr(e.target.value)} style={INP}><option value="viewer">Viewer — read only</option><option value="rider">Rider</option><option value="admin">Admin — full access</option></select></Fld>
          <Btn onClick={()=>{if(un&&uw&&up)onAddUser({name:un,username:uw,password:up,role:ur});}}>✓ Create User</Btn>
        </div>}
      </div>
    </div>
  );
}

function Logo({size=32}){return<div style={{display:"flex",alignItems:"center",gap:9}}><div style={{width:size,height:size,borderRadius:size*.28,background:"linear-gradient(135deg,#00E5A0,#4A9EFF)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:size*.5,color:"#000",fontWeight:900,flexShrink:0}}>⚡</div><span style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:size*.68,fontWeight:700,background:"linear-gradient(90deg,#00E5A0,#60EFFF)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:-.5}}>VoltFlow</span></div>;}
function Card({label,children}){return<div style={{background:C.card,borderRadius:16,padding:18,border:`1px solid ${C.border}`}}>{label&&<div style={{fontSize:10,color:C.muted,fontWeight:700,letterSpacing:1.8,textTransform:"uppercase",marginBottom:14}}>{label}</div>}{children}</div>;}
function Mini({label,val,sub,color}){return<div style={{background:C.card,borderRadius:14,padding:16,border:`1px solid ${C.border}`}}><div style={{fontSize:11,color:C.muted,marginBottom:7}}>{label}</div><div style={{fontSize:24,fontWeight:700,color,letterSpacing:-.5}}>{val}</div>{sub&&<div style={{fontSize:11,color:C.muted,marginTop:5}}>{sub}</div>}</div>;}
function PBar({pct}){const color=pct>=80?C.accent:pct>=50?C.gold:C.red;return<div style={{background:C.surface,borderRadius:999,height:8,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,borderRadius:999,background:`linear-gradient(90deg,${color}88,${color})`,transition:"width .8s ease"}}/></div>;}
function SBadge({status}){const color=sc(status);const l=status==="maintenance"?"🔧 Service":status==="off-road"?"⛔ Off-Road":"✓ Active";return<div style={{background:color+"22",border:`1px solid ${color}44`,borderRadius:20,padding:"5px 12px",fontSize:12,fontWeight:700,color,whiteSpace:"nowrap"}}>{l}</div>;}
function Chip({label,color}){return<div style={{background:color+"22",border:`1px solid ${color}44`,borderRadius:20,padding:"4px 11px",fontSize:11,fontWeight:700,color,whiteSpace:"nowrap"}}>{label}</div>;}
function Banner({color,icon,children}){return<div style={{background:color+"15",border:`1px solid ${color}33`,borderRadius:14,padding:"14px 16px",display:"flex",gap:12,alignItems:"flex-start"}}><span style={{fontSize:22,lineHeight:1.1,flexShrink:0}}>{icon}</span><div style={{flex:1}}>{children}</div></div>;}
function IR({l,v}){return<div style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}><span style={{fontSize:13,color:C.muted}}>{l}</span><span style={{fontSize:13,maxWidth:"60%",textAlign:"right"}}>{v}</span></div>;}
function PLR({l,v,pos=false,color,bold}){return<div style={{display:"flex",justifyContent:"space-between",padding:"9px 0",borderBottom:`1px solid ${C.border}`}}><span style={{fontSize:13,color:bold?C.text:C.muted,fontWeight:bold?700:400,flex:1,paddingRight:8}}>{l}</span><span style={{fontSize:13,fontWeight:bold?700:600,color:color||(pos?C.accent:C.red),whiteSpace:"nowrap"}}>{pos?"+":"-"}K{fmt(v)}</span></div>;}
function Stat({l,v,c}){return<div><div style={{fontSize:10,color:C.muted,marginBottom:4}}>{l}</div><div style={{fontSize:15,fontWeight:700,color:c||C.text}}>{v}</div></div>;}
function Fld({label,children}){return<div><div style={{fontSize:12,color:C.muted,marginBottom:7,fontWeight:700}}>{label}</div>{children}</div>;}
function Label({children}){return<div style={{fontSize:12,color:C.muted,marginBottom:7,fontWeight:700}}>{children}</div>;}
function Btn({onClick,children}){return<button className="press" onClick={onClick} style={{width:"100%",background:C.accent,color:"#000",borderRadius:13,padding:"15px",fontWeight:700,fontSize:16,marginTop:6}}>{children}</button>;}
function GBtn({onClick,color,children}){return<button className="press" onClick={onClick} style={{background:color+"22",color,borderRadius:20,padding:"7px 15px",fontSize:13,fontWeight:700,border:`1px solid ${color}44`}}>{children}</button>;}
function BackBtn({onClick}){return<button className="press" onClick={onClick} style={{display:"flex",alignItems:"center",gap:7,color:C.muted,fontSize:14,padding:"2px 0"}}>← Back</button>;}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
